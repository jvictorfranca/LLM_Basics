
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do
          sleep 1
        done
        ollama pull "$$OLLAMA_MODEL"
        wait

    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    # Enable NVIDIA GPU acceleration for LLM inference.
    # Requires NVIDIA Container Toolkit on the host machine.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # Check whether the configured model is available.
    healthcheck:
      test:
        - CMD-SHELL
        - ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s

    restart: unless-stopped

  python-app:
    build: .
    container_name: python-app

    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      DATABASE_URL: sqlite:////app/data/database.db

    ports:
      - "8000:8000"

    volumes:
      - sqlite_data:/app/data

    # Wait until Ollama and its model are ready.
    depends_on:
      ollama:
        condition: service_healthy

    restart: unless-stopped

volumes:
  ollama_data:
  sqlite_data:
